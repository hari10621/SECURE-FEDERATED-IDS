[project]
name = "securefed-ids-backend"
version = "0.1.0"
description = "Local-first SecureFed-IDS backend foundation"
requires-python = ">=3.10"
dependencies = [
    "fastapi==0.164.0",
    "pydantic==2.14.3",
    "SQLAlchemy==2.1.9",
    "python-multipart==0.0.34",
    "uvicorn==0.54.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.2.0",
    "httpx==0.28.1",
]
crypto = [
    "tenseal==0.3.18",
]
training = [
    "tensorflow==2.21.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
